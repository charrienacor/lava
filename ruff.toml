# Ruff configuration for Lava.
#
# `ruff check` enforces the exact set below — the codes this codebase is
# clean against. We select specific codes (not whole families) so that
# `ruff check` passes with zero findings and stays stable as ruff evolves.
#
# BLE001 (blind `except Exception`) is deliberately NOT selected. This
# codebase catches broadly at its system boundaries — network calls, TTS/ASR
# workers, MCP connections, and WebSocket sends — where the concrete
# exception type is unknowable and the correct response is to log and degrade
# gracefully, never crash a turn. Every such catch logs or re-raises a domain
# error; none silently swallow. See the inline comments at each site.

[lint]
select = [
    "I001",     # unsorted / unformatted import blocks
    "UP032",    # f-string over .format()
    "UP041",    # TimeoutError over aliased socket.timeout
    "SIM102",   # collapsible nested if
    "SIM114",   # combine if branches with the same body
    "SIM115",   # open() with a context manager
    "S110",     # try/except/pass — log instead
    "S112",     # try/except/continue — log instead
    "TRY004",   # type-check via TypeError, not isinstance
    "RUF046",   # unnecessary cast to int
    "RUF059",   # unused unpacked variable
    "PLW0602",  # `global` with no assignment
    "FURB167",  # regex flag alias (re.I -> re.IGNORECASE)
]
