<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0706">
  <meta name="color-scheme" content="dark">
  <title>Lava</title>
  <link rel="icon" type="image/x-icon" sizes="16x16 24x24 32x32 48x48 64x64" href="/favicon.ico">
  <!-- JetBrains Mono is self-hosted (/static/fonts, see app.css @font-face):
       the UI renders identically with no network. -->
  <link rel="preload" href="/static/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
</head>

<body>

  <div class="sound-banner" id="soundBanner">Sound is muted — tap to unmute</div>
  <div class="mic-banner" id="micBanner" role="alert">
    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3" />
      <path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
      <path d="M12 17.5V21" />
      <path d="M9 21h6" />
    </svg>
    <div class="mic-text">
      <div class="mic-title" id="micBannerTitle">Microphone unavailable</div>
      <div id="micBannerMsg"></div>
    </div>
    <button id="micRetryBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <path d="M21 3v6h-6" />
      </svg>
      Retry
    </button>
  </div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <div class="brand">
    <div class="name"><span class="w">l</span><span class="w">a</span><span class="mo">v</span><span
        class="mo">a</span><span class="dot"></span></div>
  </div>

  <nav class="mcp-tray" id="mcpTray" aria-label="MCP servers">
    <button class="mcp-toggle" id="mcpToggle" type="button" aria-expanded="false" aria-controls="mcpTrayPanel"
      title="MCP servers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
      <span class="mcp-name">Tools</span>
      <svg class="mcp-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    <div class="mcp-tray-panel" id="mcpTrayPanel">
      <p class="mcp-legend"><span class="star">★</span> Lava asks first</p>
      <div id="mcpGroups"></div>
    </div>
  </nav>

  <main>
    <div class="orb-zone" id="orbZone">
      <div class="orb-wrap" id="orbWrap" role="button" tabindex="0"
        aria-label="Start talking to Lava">
        <canvas class="wave" id="wave" aria-hidden="true"></canvas>
      </div>
      <div class="state-label" id="stateLabel" role="status"></div>
    </div>

    <div class="chat" id="chat" role="log" aria-live="polite"
      aria-label="Conversation transcript"></div>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
